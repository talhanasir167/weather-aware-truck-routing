services:
  - type: web
    name: weather-truck-api
    runtime: python
    plan: free # 0.1 CPU / 512 MB — free tier
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: DJANGO_ENV
        value: prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Optional — leave unset; app falls back to in-memory cache
      - key: REDIS_URL
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: weather-truck-db
          property: connectionString
      - key: ORS_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://weather-aware-truck-routing-sable.vercel.app,http://localhost:5173

databases:
  - name: weather-truck-db
    plan: free # 0.1 CPU / 256 MB — free tier
